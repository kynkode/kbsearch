<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Three</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-0 md:p-6">

    <div class="w-full h-screen md:h-[90vh] max-w-4xl bg-white md:rounded-2xl shadow-xl overflow-hidden flex flex-col border border-gray-100">

        <!-- Top Header -->
        <header class="flex items-center justify-between px-6 py-4 bg-[#0b1f3f] text-white shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide">Dr. Three</h1>
                    <p class="text-xs text-blue-200">Speaking from 3 verified knowledge bases</p>
                </div>
            </div>
            <div class="text-xs bg-blue-900/60 px-3 py-1.5 rounded-lg text-blue-200 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
            </div>
        </header>

        <!-- Chat History Container -->
        <div id="chatContainer" class="flex-1 p-6 overflow-y-auto space-y-6 flex flex-col">
            <!-- Welcome Message -->
            <div class="flex items-start gap-4 max-w-2xl">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-md">
                    <i class="fa-solid fa-robot text-xs"></i>
                </div>
                <div class="bg-gray-50 border border-gray-100 p-4 rounded-2xl text-gray-800 text-sm shadow-sm space-y-2">
                    <p class="font-medium text-gray-900">Hello! I am your AI search assistant.</p>
                    <p class="text-gray-600">Ask me anything about our knowledge base, and I will answer with direct references and source URLs.</p>
                </div>
            </div>
        </div>

        <!-- Input Bar Area -->
        <div class="p-4 bg-white border-t border-gray-100 shrink-0">
            <form id="chatForm" class="flex items-center gap-3">
                <input type="text" id="queryInput" placeholder="Ask a question..." autocomplete="off"
                    class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                <button type="submit" id="sendBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl text-sm font-medium transition shadow-md flex items-center gap-2 cursor-pointer disabled:opacity-50">
                    <span>Send</span> <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- Script Logic -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRQTmIjY4KCy4Gd9G3WQ4jWem0za7MnO8YkRqKprsMesXSpuMpStOzuiMJIjWvP0wR/exec"; // Replace with your Apps Script URL

        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(sender, text, sources = []) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-4 max-w-2xl ${isUser ? 'ml-auto flex-row-reverse' : ''}`;

            let sourcesHtml = '';
            if (sources && sources.length > 0 && !isUser) {
                sourcesHtml = `
                    <div class="mt-3 pt-3 border-t border-gray-200/60">
                        <p class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Sources & References:</p>
                        <div class="flex flex-wrap gap-2">
                            ${sources.map(s => `<a href="${s.url}" target="_blank" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md border border-blue-100 transition flex items-center gap-1.5"><i class="fa-solid fa-link text-[10px]"></i> ${s.title}</a>`).join('')}
                        </div>
                    </div>
                `;
            }

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-gray-800' : 'bg-blue-600'} text-white flex items-center justify-center shrink-0 shadow-md">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'} text-xs"></i>
                </div>
                <div class="${isUser ? 'bg-blue-600 text-white' : 'bg-gray-50 border border-gray-100 text-gray-800'} p-4 rounded-2xl text-sm shadow-sm space-y-2">
                    <p class="whitespace-pre-wrap leading-relaxed">${text}</p>
                    ${sourcesHtml}
                </div>
            `;

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoadingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.id = 'loadingIndicator';
            wrapper.className = 'flex items-start gap-4 max-w-2xl';
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-md">
                    <i class="fa-solid fa-robot text-xs"></i>
                </div>
                <div class="bg-gray-50 border border-gray-100 p-4 rounded-2xl text-gray-500 text-sm shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-blue-600"></i> Searching knowledge base...
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.remove();
        }

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            queryInput.value = '';
            queryInput.disabled = true;
            sendBtn.disabled = true;

            appendMessage('user', query);
            appendLoadingIndicator();

            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'chat', query: query })
                });
                const data = await res.json();

                removeLoadingIndicator();

                if (data.status === 'success') {
                    appendMessage('ai', data.response, data.sources);
                } else {
                    appendMessage('ai', `Error: ${data.error || 'Failed to retrieve response.'}`);
                }
            } catch (err) {
                removeLoadingIndicator();
                appendMessage('ai', `Network Error: ${err.message}`);
            }

            queryInput.disabled = false;
            sendBtn.disabled = false;
            queryInput.focus();
        };
    </script>
</body>
</html>
